<script>
/* 药理学 · 自测：教材 / 知识要点 / 搜索基线 + 刷题（复刻阶段考）全流程 */
(function () {
  var Z = window.YL, UI = window.YL_UI, YQ = window.YL_QUIZ_UI;
  var P = 0, F = 0, L = [];
  function ok(n, c, d) { if (c) { P++; } else { F++; L.push('FAIL ' + n + (d !== undefined ? ' :: ' + d : '')); } }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function q(sel) { return document.querySelector(sel); }
  function qa(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  function nav(h) { location.hash = h; UI.render(); }
  function mainTxt() { return (document.getElementById('main').textContent || ''); }
  function clickDialogYes() {
    var b = document.querySelector('#dialog .btn.primary');
    if (b) { b.click(); return; }
    var list = document.querySelectorAll('#dialog [data-di]');
    if (list.length) list[list.length - 1].click();
  }

  async function run() {
    try {
      /* ---------------- 数据基线 ---------------- */
      ok('教材条目与统计一致（≥900）', Z.MAT.stats.entries === Z.MAT.entries.length && Z.MAT.stats.entries >= 900, Z.MAT.stats.entries);
      ok('药物卡与统计一致（≥500）', Z.MAT.stats.drugs === Z.MAT.entries.filter(function (e) { return e.kind === 'drug'; }).length && Z.MAT.stats.drugs >= 500, Z.MAT.stats.drugs);
      ok('知识要点条与统计一致（≥50）', Z.KP.stats.items === Z.KP.items.length && Z.KP.stats.items >= 50, Z.KP.stats.items);
      ok('导图与表格数量正常', Z.KP.stats.images >= 20 && Z.KP.stats.tables >= 20, Z.KP.stats.images + '/' + Z.KP.stats.tables);
      ok('题库 1962（含第三十五章 OCR 补录）', Z.QZ.stats.questions === 1962 && Z.QZ.stats.questions === Z.QZ.questions.length, Z.QZ.stats.questions);
      ok('题型数 A1/B1/X/NM/QA', Z.QZ.stats.A1 === 802 && Z.QZ.stats.B1 === 454 && Z.QZ.stats.X === 527 && Z.QZ.stats.NM === 5 && Z.QZ.stats.QA === 174,
        [Z.QZ.stats.A1, Z.QZ.stats.B1, Z.QZ.stats.X, Z.QZ.stats.NM, Z.QZ.stats.QA].join('/'));

      /* ---------------- 教材 / 知识要点（原断言保留） ---------------- */
      /* ---------------- 新增：标题层级 / 内容归属 / OCR 补录 ---------------- */
      var AUX = /^(学习要求|学习目标|本章小结|小结|目标测试|思考题|复习思考题|练习题|课后练习|复习题|案例|案例分析|知识链接|知识拓展|拓展阅读|课堂讨论|关键词|本章要点|导学|自学)$/;
      var auxHit = Z.MAT.entries.filter(function (e) { return AUX.test(String(e.name).replace(/^[一-龥、（）()0-9.\s]+/, '').trim()) || AUX.test(String(e.name).trim()); });
      ok('教材：教学辅助标题 0 条', auxHit.length === 0, auxHit.slice(0, 3).map(function (e) { return e.name; }).join('|'));
      var sup = Z.MAT.entries.filter(function (e) { return e.supplement; });
      ok('教材：补录「（二）去甲肾上腺素能神经」', sup.some(function (e) { return e.name.indexOf('去甲肾上腺素能神经') >= 0; }), sup.length);
      var ch7 = Z.MAT.chapters.filter(function (c) { return c.num === 7; })[0];
      ok('教材：第七章有隐式节且条目 ≥ 10', !!ch7 && ch7.sectionIds.length >= 1 && ch7.entryIds.length >= 10,
        ch7 ? ch7.sectionIds.length + '/' + ch7.entryIds.length : 'NO');
      var empt = Z.MAT.sections.filter(function (s) { return !s.entryIds.length && !(s.introBlocks && s.introBlocks.length); });
      ok('教材：每节都有条目或节前置正文', empt.length === 0, empt.length);
      var introSec = Z.MAT.sections.filter(function (s) { return s.introBlocks && s.introBlocks.length; }).length;
      var introCh = Z.MAT.chapters.filter(function (c) { return c.introBlocks && c.introBlocks.length; }).length;
      ok('教材：章/节前置正文已保留', introSec >= 80 && introCh >= 20, introCh + '/' + introSec);
      ok('教材：同一父节点下无重复名', (function () {
        /* 不同父节点下允许同名（如第十一章 二、人工合成镇痛药 下另有「（一）阿片受体激动药」） */
        var seen = {}, dup = 0;
        Z.MAT.sections.forEach(function (s) {
          var loc = {};
          s.entryIds.forEach(function (id) {
            var e = Z.matBy[id]; if (!e || e.introOf) return;
            var k = (e.parent || '') + '|' + String(e.name).replace(/\s+/g, '');
            if (loc[k]) dup++; loc[k] = 1;
          });
        });
        return dup === 0;
      })());
      var ch35 = Z.QZ.chapters.filter(function (c) { return c.num === 35; })[0];
      var c35 = Z.QZ.questions.filter(function (q) { return q.chapterId === ch35.id; });
      var c35t = {}; c35.forEach(function (q) { c35t[q.type] = (c35t[q.type] || 0) + 1; });
      ok('第三十五章 OCR 补录 29/16/20/7',
        c35t.A1 === 29 && c35t.B1 === 16 && c35t.X === 20 && c35t.QA === 7,
        [c35t.A1, c35t.B1, c35t.X, c35t.QA].join('/'));

      nav('#/mat');
      ok('教材目录章行', qa('[data-chap]').length > 0, qa('[data-chap]').length);
      /* 概述卡：章/节前置正文现在是可点的卡片（用户 2026-11-23 要求） */
      var introList = Z.MAT.entries.filter(function (e) { return e.kind === 'intro'; });
      ok('概述卡数量正常（章+节 ≥ 100）', introList.length >= 100, introList.length);
      ok('概述卡分章/节两类',
        introList.some(function (e) { return e.introOf === 'chapter'; }) &&
        introList.some(function (e) { return e.introOf === 'section'; }));
      if (q('[data-chap] .chap-hd')) q('[data-chap] .chap-hd').click();
      await wait(20);
      ok('目录里出现概述卡（述）', qa('.er-kind.intro').length >= 1, qa('.er-kind.intro').length);

      /* ---------- v2.4.0：目录只到「一、」，其下全部进卡片正文 ---------- */
      nav('#/mat');
      await wait(30);
      qa('[data-chap] .chap-hd').forEach(function (hd) {
        if (!hd.closest('[data-chap]').classList.contains('open')) hd.click();
      });
      await wait(40);
      var tocNames = qa('.ec-list .er-nm').map(function (n) { return n.textContent.replace(/\s+/g, ''); });
      var rowN = Z.MAT.entries.filter(function (e) { return (e.path || []).length === 0 || e.kind === 'drug'; }).length;
      ok('目录行数 = 一、/概述 + 每张药卡', tocNames.length === rowN, tocNames.length + '/' + rowN);
      var secL1 = {};
      Z.MAT.entries.forEach(function (e) {
        if (e.kind !== 'drug' && (e.path || []).length === 0 && /^[一二三四五六七八九十]+、/.test(e.name)) secL1[e.sectionId] = 1;
      });
      var strayOne = Z.MAT.entries.filter(function (e) {
        return e.kind !== 'drug' && (e.path || []).length === 0 &&
          /^[（(][一二三四五六七八九十]+[）)]/.test(e.name) && secL1[e.sectionId];
      });
      ok('（一）只在没有「一、」的节里才当顶层行', strayOne.length === 0,
        strayOne.map(function (e) { return e.name; }).slice(0, 3).join('|'));
      function chapToc(num) {
        var c = Z.MAT.chapters.filter(function (x) { return x.num === num; })[0];
        var box = c ? document.querySelector('[data-chap="' + c.id + '"] .ec-list') : null;

          return String(n.firstChild ? n.firstChild.textContent : n.textContent).replace(/\s+/g, '');
        }) : [];
      }
      var want6 = ['本章概述', '一、构效关系与分类', '二、α受体激动药', '去甲肾上腺素', '间羟胺', '去氧肾上腺素',

        '肾上腺素', '多巴胺', '麻黄碱', '本节概述', '一、α受体拮抗药', '酚妥拉明', '妥拉唑林', '酚苄明',

      var want35 = ['本节概述', '一、β-内酰胺类抗生素概述', '二、青霉素类抗生素', '青霉素', '甲氧西林',
        '苯唑西林oxacillin萘夫西林nafcillin氯唑西林', '氨苄西林ampicillin阿莫西林', '羧苄西林', '哌拉西林',
        '替卡西林', '阿洛西林azlocillin美洛西林', '美西林mecillinam替莫西林temocillin匹美西林',
        '三、头孢菌素类抗生素', '四、其他β-内酰胺类抗生素', '五、β-内酰胺酶抑制药及其复方制剂',
        '本节概述', '达托霉素', '磷霉素'];

      ok('第三十五章目录（用例 A 的目录部分）', JSON.stringify(got35) === JSON.stringify(want35),

      var grpA = Z.MAT.entries.filter(function (e) { return e.name === '二、α受体激动药'; })[0];
      nav('#/entry/' + grpA.id);
      await wait(50);
      var gtxt = q('#ct-body') ? q('#ct-body').textContent : '';
      ok('「一、」卡片正文含（一）（二）（三）子标题',
        gtxt.indexOf('（一）') >= 0 && gtxt.indexOf('（二）') >= 0 && gtxt.indexOf('（三）') >= 0);
      ok('「一、」卡片正文含 1./2. 子标题', /1\.\s*外周/.test(gtxt) && /2\.\s*中枢/.test(gtxt), gtxt.length);
      ok('「一、」卡片里有药名链接', qa('#ct-body .dl').length >= 3, qa('#ct-body .dl').length);
      var dl0 = q('#ct-body .dl');
      if (dl0) {
        var dlHref = dl0.getAttribute('href');
        nav(dlHref);
        await wait(50);
        ok('点药名链接可进药卡且有正文', !!q('#ct-body') && q('#ct-body').textContent.length > 50 && mainTxt().indexOf('去甲肾上腺素') >= 0,
          q('#ct-body') ? q('#ct-body').textContent.length : 'NO');
        ok('药卡显示上级路径', !!q('.crumb-row .crumb'), qa('.crumb-row .crumb').length);
      }
      var e35 = Z.MAT.entries.filter(function (e) { return e.name.indexOf('β-内酰胺类抗生素概述') >= 0; })[0];
      nav('#/entry/' + e35.id);
      await wait(50);
      var b35 = q('#ct-body') ? q('#ct-body').textContent.replace(/\s+/g, '') : '';
      var i1 = b35.indexOf('（一）分类'), i2 = b35.indexOf('1.青霉素类'), i3 = b35.indexOf('（1）天然青霉素');
      ok('第三十五章：正文顺序（一）分类 → 1.青霉素类 →（1）天然青霉素', i1 >= 0 && i1 < i2 && i2 < i3, [i1, i2, i3].join('/'));
      ok('第三十五章：4.β-内酰胺酶抑制药 在（二）化学结构 之前',
        b35.indexOf('4.β-内酰胺酶抑制药') >= 0 && b35.indexOf('4.β-内酰胺酶抑制药') < b35.indexOf('（二）化学结构'));
      ok('第三十五章：（四）耐药机制下 3.积聚减少 →（1）降低细胞壁外膜通透性',
        b35.indexOf('3.细菌体内的β-内酰胺类抗生素积聚减少') >= 0 &&
        b35.indexOf('3.细菌体内的β-内酰胺类抗生素积聚减少') < b35.indexOf('（1）降低细胞壁外膜通透性'));

      var ie = introList.filter(function (e) { return e.introOf === 'chapter'; })[0];
      nav('#/entry/' + ie.id);
      await wait(40);   /* 等 hashchange 触发的二次渲染结束，否则面板会被冲掉 */
      ok('概述卡可打开且有正文', !!q('#ct-body') && q('#ct-body').textContent.length > 60,
        q('#ct-body') ? q('#ct-body').textContent.length : 'NO');
      ok('概述卡有笔记/收藏/编辑按钮',
        qa('[data-act="note"]').length === 1 && qa('[data-act="fav"]').length === 1 &&
        qa('[data-act="edit"]').length === 1);
      ok('概述卡标签显示「概述」', mainTxt().indexOf('概述') >= 0);
      q('[data-act="edit"]').click();
      await wait(20);
      var cp = document.getElementById('card-panel');
      ok('概述卡可打开编辑面板', !!q('.panel') && cp && cp.innerHTML.length > 0,
        cp ? ('panelHTML=' + cp.innerHTML.length) : 'NO#card-panel');
      ok('编辑面板按段落分字段', qa('.ef').length >= 1, qa('.ef').length);
      if (q('[data-pc="close"]')) q('[data-pc="close"]').click();
      q('[data-act="fav"]').click();
      await wait(10);
      if (q('[data-pc="fav-do"]')) q('[data-pc="fav-do"]').click();
      await wait(20);
      ok('概述卡可收藏', !!Z.store.fav[ie.id]);
      Z.toggleFav(ie.id);
      var drug = Z.MAT.entries.filter(function (e) { return e.kind === 'drug' && e.blocks.length; })[0];
      nav('#/entry/' + drug.id);
      var body = q('#ct-body');
      ok('药物卡渲染有内容', body && body.textContent.length > 50, body ? body.textContent.length : 'NO');
      var tblE = Z.MAT.entries.filter(function (e) { return e.blocks.some(function (b) { return b.t === 'table'; }); })[0];
      if (tblE) { nav('#/entry/' + tblE.id); ok('含表格卡片渲染 table/图片', !!q('.tbl-wrap table') || !!q('.tbl-fig img')); }
      /* §2.6 内容归属红线：教材卡不得出现习题集的导图/表格 */
      ok('教材条目无任何导图挂载', !Z.MAT.entries.some(function (e) { return (e.maps && e.maps.length) || e.blocks.some(function (b) { return b.t === 'img'; }); }));
      ok('教材条目 src 全为 book', Z.MAT.entries.every(function (e) { return e.src === 'book'; }));
      ok('知识要点 src 全为 guide', Z.KP.items.every(function (i) { return i.src === 'guide'; }));

      /* 检查更新 / 强制刷新（用户 2026-11-23 反馈更新慢） */
      nav('#/me');
      ok('我的页有「检查」与「强制刷新」两个入口', !!q('#upd-btn') && !!q('#upd-hard'));
      if (q('#upd-hard')) q('#upd-hard').click();
      await wait(20);
      ok('强制刷新会先弹确认（不直接清缓存）', document.getElementById('dialog').classList.contains('on'));
      var dcb = document.querySelectorAll('#dialog [data-di]');
      if (dcb.length) dcb[0].click();   /* 取消 */
      await wait(20);
      ok('取消后页面不变', location.hash.indexOf('#/me') >= 0);

      nav('#/home');
      ok('首页：封面卡结构就位', !!q('.hero .hero-t') && !!q('.hero-en') && qa('.hero-stats .hs').length === 3);
      ok('首页：不再出现「4 种题型」旧文案', mainTxt().indexOf('4 种题型') < 0);
      ok('首页：三个入口 + 搜索', qa('.big-grid .big').length === 4, qa('.big-grid .big').length);

      nav('#/kp');
      ok('知识点目录 42 章（连续序号）', qa('.kp-chap').length === 42 &&
        qa('.kc-no')[0].textContent === '1', qa('.kp-chap').length);
      var kpWithImg = Z.KP.items.filter(function (i) { return i.blocks.some(function (b) { return b.t === 'img'; }); })[0];
      nav('#/kpi/' + kpWithImg.id);
      ok('知识点导图渲染', !!q('.rich-img img'));

      /* §2.7 回归：知识要点里每一张导图都必须真的能加载（不能只看 img 标签存在） */
      var imgSrcs = [];
      Z.KP.items.forEach(function (it) { it.blocks.forEach(function (b) { if (b.t === 'img') imgSrcs.push(b.src); }); });
      ok('知识要点导图引用 40 张', imgSrcs.length === 40, imgSrcs.length);
      var bad = [];
      await Promise.all(imgSrcs.map(function (src) {
        return new Promise(function (res) {
          var im = new Image();
          im.onload = function () { if (!(im.naturalWidth > 0)) bad.push(src + ':0'); res(); };
          im.onerror = function () { bad.push(src + ':ERR'); res(); };
          im.src = src;
          setTimeout(function () { res(); }, 6000);
        });
      }));
      ok('知识要点导图全部真实可加载', bad.length === 0, bad.slice(0, 4).join('|'));

      nav('#/search?kw=' + encodeURIComponent('阿托品'));
      var sinp = q('#s-kw'); if (sinp) { sinp.value = '阿托品'; sinp.oninput && sinp.oninput(); }

      Z.store.qfav = {}; Z.store.qnotes = {}; Z.store.sessions = {};

      ok('题型页有练习/快刷/背题模式', qa('[data-mode]').length === 3, qa('[data-mode]').length);

      UI.render();

      /* ---------------- 开始答题：单题提交、立即判对错 ---------------- */

      await wait(10);

      if (optEl) optEl.click();
      await wait(10);
      ok('点选项立即判对', Z.store.rec[q0.id] && Z.store.rec[q0.id].st === 1,
        Z.store.rec[q0.id] ? Z.store.rec[q0.id].st : 'no');
      ok('立即显示正确答案', mainTxt().indexOf('正确答案：') >= 0);
      ok('判定后显示「答对了」', mainTxt().indexOf('答对了') >= 0);
      ok('判定后仍无「交卷」', mainTxt().indexOf('交卷') < 0);

      /* 需求 4：离开再进，痕迹仍在 */
      var runH = location.hash;
      nav('#/qcard/' + s0.cid + '?t=' + s0.type);
      ok('答题卡正确状态色（绿）', !!q('.qz-cell.s1'), qa('.qz-cell.s1').length);
      nav(runH);
      ok('重进同题痕迹仍在（原选择/判定/答案）',
        qa('.qz-opt.right').length > 0 && mainTxt().indexOf('正确答案：') >= 0,
        'right=' + qa('.qz-opt.right').length);

      /* 需求 5：每题都有「重做本题」 */
      var redoBtn = q('#q-redo');
      ok('每题都有「重做本题」按钮', !!redoBtn);
      if (redoBtn) redoBtn.click();
      await wait(10);
      ok('重做本题弹确认（含历史统计）', document.getElementById('dialog').classList.contains('on'));
      clickDialogYes();
      await wait(30);
      ok('每题重做清除本题痕迹', Z.store.rec[q0.id] && Z.store.rec[q0.id].st === 0 &&
        mainTxt().indexOf('正确答案：') < 0, Z.store.rec[q0.id] ? Z.store.rec[q0.id].st : 'no');
      ok('重做后选项恢复可作答', qa('[data-opt]').length > 0 && qa('.qz-opt.right').length === 0);

      /* 答错 → 立即判错并显示正确答案 */
      var wrongKey = null;
      qa('[data-opt]').forEach(function (b) {
        var k = b.getAttribute('data-opt');
        if (!wrongKey && (q0.answer || []).indexOf(k) < 0) wrongKey = k;
      });
      if (wrongKey) q('[data-opt="' + wrongKey + '"]').click();
      await wait(10);
      ok('答错立即判错并显示正确答案', Z.store.rec[q0.id] && Z.store.rec[q0.id].st === 2 &&
        !!q('.qz-res.bad') && mainTxt().indexOf('正确答案：') >= 0,
        Z.store.rec[q0.id] ? Z.store.rec[q0.id].st : 'no');

      /* 错题本视图 */
      nav('#/qwrong?seg=wrong');
      ok('错题本视图列出错题', qa('[data-wb]').length >= 1, qa('[data-wb]').length);

      /* 答题卡错误状态色 */
      nav('#/qcard/' + s0.cid + '?t=' + s0.type);
      ok('答题卡错误状态色（红）', !!q('.qz-cell.s2'), qa('.qz-cell.s2').length);

      /* 从答题卡「开始/继续」应回到上次做到的位置 */
      nav('#/qcard/' + s0.cid + '?t=' + s0.type);
      var g2 = q('#gStart');
      if (g2) g2.click();
      UI.render();
      await wait(10);
      var nxBtn = q('#q-next');
      if (nxBtn) nxBtn.click();
      await wait(10);
      var resumeIdx = Z.store.sessions.cur.idx;
      nav('#/qcard/' + s0.cid + '?t=' + s0.type);
      var g3 = q('#gStart');
      if (g3) g3.click();
      UI.render();
      await wait(10);
      ok('从答题卡继续作答保持上次进度', Z.store.sessions.cur.idx === resumeIdx,
        Z.store.sessions.cur.idx + '/' + resumeIdx);

      /* 自定义批量重做：用户自行选哪几题（保留重做本题型） */
      nav('#/qcard/' + s0.cid + '?t=' + s0.type);
      var selList = YQ.listOf(s0.cid, s0.type, 'all');
      selList.slice(0, 2).forEach(function (qq) {
        Z.store.rec[qq.id] = { c: (qq.answer && qq.answer[0]) || 'A', st: 1, ts: Date.now() };
      });
      Z.save(true);
      nav('#/qcard/' + s0.cid + '?t=' + s0.type);
      await wait(10);
      ok('答题卡有「自定义重做」入口', !!q('#gSel'));
      if (q('#gSel')) q('#gSel').click();
      await wait(10);
      ok('进入选择模式：底部操作条出现', !!q('#selbar.on'));
      var beforeHash = location.hash, clickedN = 0;
      qa('.qz-cell').forEach(function (b) {
        if (clickedN >= 2) return;
        if (b.classList.contains('s1') || b.classList.contains('s2')) { b.click(); clickedN++; }
      });
      await wait(10);
      ok('选择模式下点格子不跳转答题页', location.hash === beforeHash, location.hash);
      ok('已选计数正确', q('#seln') && q('#seln').textContent === String(clickedN),
        q('#seln') ? q('#seln').textContent : 'NO');
      ok('选中格子有选中态', qa('.qz-cell.sel').length === clickedN, qa('.qz-cell.sel').length);
      if (q('#selDo')) q('#selDo').click();
      await wait(10);
      ok('重做所选会弹确认', document.getElementById('dialog').classList.contains('on'));
      clickDialogYes();
      await wait(40);
      var stillDone = selList.slice(0, 2).filter(function (qq) {
        var r = Z.store.rec[qq.id];
        return r && r.st !== 0;
      });
      ok('重做所选只清选中的题', stillDone.length === 0,
        stillDone.map(function (x) { return x.id; }).join(','));

      /* 需求 6：答题卡题型行「重做本题型」批量清痕迹（无弹窗式范围选择） */
      nav('#/qcard/' + s0.cid + '?t=' + s0.type);
      var rdType = q('[data-redo="A1"]');
      ok('题型行「重做本题型」存在', !!rdType);
      if (rdType) rdType.click();
      await wait(10);
      ok('重做本题型为简单确认（无范围选择弹窗）',
        document.getElementById('dialog').classList.contains('on') && !q('#brFrom') && !q('.brrange'));
      clickDialogYes();
      await wait(30);
      var a1st = YQ.statOf(s0.cid, 'A1', 'all');
      ok('题型行批量重做清空该题型', a1st.done === 0, JSON.stringify(a1st));
      ok('批量重做后答题卡回到未做', qa('.qz-cell.s1,.qz-cell.s2,.qz-cell.s3,.qz-cell.s4').length === 0,
        qa('.qz-cell.s1,.qz-cell.s2,.qz-cell.s3,.qz-cell.s4').length);

      /* 配伍题：共用备选答案 + 点选项判对 + 已掌握状态 */
      var chB1 = null;
      Z.QZ.chapters.forEach(function (c) {
        if (!chB1 && c.types.some(function (t) { return t.t === 'B1' && t.qids.length; })) chB1 = c;
      });
      nav('#/qcard/' + chB1.id + '?t=B1');
      var bStart = q('[data-start="B1"]');
      if (bStart) bStart.click();
      UI.render();
      await wait(10);
      var bs = Z.store.sessions.cur;
      var bq = YQ.listOf(bs.cid, 'B1', 'all')[bs.idx];
      ok('配伍题显示共用备选答案', mainTxt().indexOf('共用备选答案') >= 0 && qa('[data-opt]').length === 5,
        mainTxt().indexOf('共用备选答案') + '/' + qa('[data-opt]').length);
      var bKey = (bq.answer || [])[0];
      var bOpt = q('[data-opt="' + bKey + '"]');
      if (bOpt) bOpt.click();
      await wait(10);
      ok('配伍题点选项立即判对', YQ.stOf(bq.id) === 1, YQ.stOf(bq.id));
      var skBtn = q('#q-skip');
      if (skBtn) skBtn.click();
      await wait(10);
      ok('「已掌握」可标记(3)', YQ.stOf(bq.id) === 3, YQ.stOf(bq.id));
      nav('#/qcard/' + chB1.id + '?t=B1');
      ok('答题卡已掌握状态色（黄）', !!q('.qz-cell.s3'), qa('.qz-cell.s3').length);


      nav('#/qcard/' + ch.id + '?t=X');
      var xStart = q('[data-start="X"]');
      if (xStart) xStart.click();
      UI.render();
      await wait(10);
      var xs = Z.store.sessions.cur;
      var xList = YQ.listOf(xs.cid, 'X', 'all');
      var xq = xList[xs.idx];
      (xq.answer || []).forEach(function (k) {
        var b = q('[data-opt="' + k + '"]');
        if (b) b.click();
      });
      await wait(10);
      var xsub = q('#q-submit');
      if (xsub) xsub.click();
      await wait(10);
      ok('多选：勾选后提交立即判分', YQ.stOf(xq.id) === 1 && mainTxt().indexOf('正确答案：') >= 0,
        YQ.stOf(xq.id));

      /* 需求 3：名词解释 → 答题框 → 提交 → 参考答案 → 自评 */
      var chNm = null;
      Z.QZ.chapters.forEach(function (c) {
        if (!chNm && c.types.some(function (t) { return t.t === 'NM' && t.qids.length; })) chNm = c;
      });
      nav('#/qcard/' + chNm.id + '?t=NM');
      var stBtn = q('[data-start="NM"]');
      if (stBtn) stBtn.click();
      UI.render();
      await wait(10);
      ok('名词解释题有答题框', !!q('#qa-txt'));
      var ta = q('#qa-txt');
      if (ta) { ta.value = '药理学是研究药物与机体相互作用及规律的学科。'; ta.oninput && ta.oninput(); }
      var subBtn = q('#q-submit');
      if (subBtn) subBtn.click();
      await wait(10);
      ok('提交后显示参考答案', mainTxt().indexOf('参考答案') >= 0);
      ok('提交后出现用户自评', mainTxt().indexOf('自评') >= 0);
      var nmList = YQ.listOf(chNm.id, 'NM', 'all');
      var nmQ = nmList[Z.store.sessions.cur.idx];
      ok('文字题提交后为待提交/待自评(4)', YQ.stOf(nmQ.id) === 4, YQ.stOf(nmQ.id));
      var okBtn = q('#qa-ok');
      if (okBtn) okBtn.click();
      await wait(10);
      ok('文字题自评后判对(1)', YQ.stOf(nmQ.id) === 1, YQ.stOf(nmQ.id));

      /* 收藏 / 笔记保留 */
      var favBtn = q('#q-fav');
      if (favBtn) favBtn.click();
      await wait(10);
      ok('题目收藏已保留', !!Z.store.qfav[nmQ.id]);
      var noteBtn = q('#q-note');
      if (noteBtn) noteBtn.click();
      await wait(10);
      ok('笔记编辑区就地展开', !!q('#note-ta'));
      var nta = q('#note-ta');
      if (nta) { nta.value = '记忆点：定义 + 研究对象'; }
      var nsave = q('#note-save');
      if (nsave) nsave.click();
      await wait(10);
      ok('题目笔记已保存', Z.store.qnotes[nmQ.id] === '记忆点：定义 + 研究对象',
        Z.store.qnotes[nmQ.id]);

      /* 答题卡点击数字跳题（优先点 NM 段的格子） */
      nav('#/qcard/' + chNm.id + '?t=NM');
      var cell = q('.qz-gsec[data-sec="NM"] .qz-cell');
      var cellQid = cell ? cell.getAttribute('data-qid') : '';
      if (cell) cell.click();
      UI.render();
      await wait(10);
      var s1 = Z.store.sessions.cur;
      var jumpQ = s1 ? YQ.listOf(s1.cid, s1.type, s1.filter)[s1.idx] : null;
      ok('答题卡点击数字跳题', location.hash === '#/qrun' && !!jumpQ && jumpQ.id === cellQid,
        location.hash + ' ' + (jumpQ && jumpQ.id) + '/' + cellQid);

      /* 背题模式（可选，不引入交卷） */
      YQ.setMode(3);
      YQ.startRun(chNm.id, 'NM', 'all', 0);
      UI.render();
      await wait(10);
      ok('背题模式直接看答案', mainTxt().indexOf('参考答案') >= 0 && !q('#qa-txt'),
        mainTxt().indexOf('参考答案') + '/' + !!q('#qa-txt'));
      YQ.setMode(0);

      nav('#/qcard/' + chNm.id + '?t=NM');
      ok('答题卡无「交卷」', mainTxt().indexOf('交卷') < 0);
      /* ── 表格图片（原书扫描）── */
      var imgBlocks = [], noImgBlocks = [];
      (window.YL_MAT.entries || []).forEach(function (e) {
        (e.blocks || []).forEach(function (b) {
          if (b.t !== 'table') return;
          if (b.img) imgBlocks.push({ e: e, b: b }); else noImgBlocks.push({ e: e, b: b });
        });
      });
      ok('表块带图 ≥25', imgBlocks.length >= 25, imgBlocks.length + '/' + (imgBlocks.length + noImgBlocks.length));
      if (imgBlocks.length) {
        var t1 = imgBlocks[0];
        nav('#/entry/' + t1.e.id);
        await wait(60);
        var fig = q('.tbl-fig img');
        ok('表格渲染成图片', !!fig && fig.getAttribute('src') === t1.b.img,
          fig && fig.getAttribute('src'));
        var loaded = false;
        if (fig) {
          loaded = fig.complete && fig.naturalWidth > 0;
          if (!loaded) {
            loaded = await new Promise(function (res) {
              fig.onload = function () { res(fig.naturalWidth > 0); };
              fig.onerror = function () { res(false); };
              setTimeout(function () { res(fig.naturalWidth > 0); }, 1500);
            });
          }
        }
        ok('表格图片真的能加载', loaded);
      }
      if (noImgBlocks.length) {
        var t2 = noImgBlocks[0];
        nav('#/entry/' + t2.e.id);
        await wait(40);
        ok('无图的表块仍渲染文字表', !!q('.tbl-wrap table'));
      }

    } catch (e) {
      F++; L.push('EXC ' + (e && e.stack ? e.stack : e));
    }
    document.getElementById('R').textContent = 'RESULT P=' + P + ' F=' + F + ' ' + L.join(' | ');
    document.title = 'YL SELFTEST P=' + P + ' F=' + F + (L.length ? ' ' + L.join(' | ') : '');
  }
  setTimeout(function () { run(); }, 400);
})();
</script></body></html>
